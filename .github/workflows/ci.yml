name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: star-learning-os
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: star
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d star"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/star
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
      ENABLE_DEV_LOGIN: "true"
      ZDR_VERIFIED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: star-learning-os/.nvmrc
          cache: pnpm
          cache-dependency-path: star-learning-os/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end smoke
        run: |
          node apps/api/dist/main.js > /tmp/star-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/v1/health/ready; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/star-api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/v1/health/ready >/dev/null || {
            cat /tmp/star-api.log
            exit 1
          }
          bash scripts/smoke.sh
