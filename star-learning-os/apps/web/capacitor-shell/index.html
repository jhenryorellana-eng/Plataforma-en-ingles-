<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StarbizAcademy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f4fb;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #17172b;
      text-align: center;
      padding: 32px;
    }
    .icon {
      width: 88px; height: 88px; border-radius: 24%;
      background: linear-gradient(120deg, #7c7aff, #5e5ce6 55%, #17b8cd 130%);
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(94, 92, 230, 0.35);
      font-size: 44px; color: #fff;
    }
    h1 { margin-top: 20px; font-size: 24px; letter-spacing: -0.02em; }
    p { margin-top: 8px; color: #7c7c93; font-size: 15px; line-height: 1.5; max-width: 34ch; }
    button {
      margin-top: 20px; border: 0; border-radius: 16px; padding: 14px 26px;
      background: #5e5ce6; color: #fff; font-size: 16px; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <span class="icon">✦</span>
    <h1>StarbizAcademy</h1>
    <p>Necesitas conexión a internet para continuar tu ruta. Cuando vuelva la señal, tu progreso te estará esperando.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
